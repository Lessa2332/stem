<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0014">
<meta name="format-detection" content="telephone=no">
<title>Доля обирає · Лабораторія</title>
<style>
  :root {
    --primary: #ff6b00;
    --primary-dark: #c2410c;
    --accent: #a3e635;
    --purple: #8b5cf6;
    --dark-bg: #0a0014;
    --card-bg: #1e0a30;
    --text-light: #f3f4f6;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: var(--dark-bg);
    background-image: 
      radial-gradient(circle at 50% 0%, rgba(139, 92, 246, 0.3) 0%, transparent 60%),
      radial-gradient(circle at 10% 90%, rgba(255, 107, 0, 0.15) 0%, transparent 50%);
    color: var(--text-light);
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 20px;
    padding-top: calc(20px + var(--safe-top));
    padding-bottom: calc(20px + var(--safe-bottom));
    user-select: none;
    -webkit-user-select: none;
  }

  /* === АНІМОВАНА ПАВУТИНА НА ФОНІ === */
  .bg-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }
  
  .bg-web svg {
    width: 100%;
    height: 100%;
    animation: webPulse 8s ease-in-out infinite alternate;
  }

  @keyframes webPulse {
    0% { transform: scale(1) rotate(0deg); opacity: 0.4; }
    100% { transform: scale(1.05) rotate(2deg); opacity: 0.6; }
  }

  /* === ПАВУЧОК === */
  .spider {
    position: absolute;
    width: 50px;
    height: 50px;
    z-index: 10;
    pointer-events: none;
    filter: drop-shadow(0 0 8px rgba(163, 230, 53, 0.6));
    /* Анімація руху по колу/хаотично */
    animation: spiderWalk 12s ease-in-out infinite;
  }

  @keyframes spiderWalk {
    0%   { top: -60px; left: 10%; transform: rotate(0deg); }
    15%  { top: 20%; left: 80%; transform: rotate(45deg); }
    30%  { top: 70%; left: 90%; transform: rotate(90deg); }
    45%  { top: 85%; left: 20%; transform: rotate(135deg); }
    60%  { top: 50%; left: 5%;  transform: rotate(180deg); }
    75%  { top: 10%; left: 40%; transform: rotate(225deg); }
    90%  { top: -60px; left: 10%; transform: rotate(360deg); }
    100% { top: -60px; left: 10%; transform: rotate(0deg); }
  }

  /* === КАРТКА === */
  .fate-card {
    position: relative;
    z-index: 5;
    background: var(--card-bg);
    border: 3px solid var(--purple);
    border-radius: 24px;
    padding: 30px 20px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 0 40px rgba(139, 92, 246, 0.4), inset 0 0 20px rgba(139, 92, 246, 0.2);
    text-align: center;
  }

  .title {
    font-size: 1.8rem;
    font-weight: 900;
    color: var(--primary);
    text-shadow: 0 0 15px rgba(255, 107, 0, 0.6);
    margin-bottom: 8px;
    line-height: 1.2;
  }

  .subtitle {
    font-size: 0.95rem;
    color: #b6b0c6;
    margin-bottom: 24px;
    font-weight: 600;
  }

  /* === РЕЗУЛЬТАТ === */
  .result-box {
    background: #140824;
    border: 2px dashed var(--accent);
    border-radius: 16px;
    padding: 20px 15px;
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
    transition: all 0.1s;
    position: relative;
    overflow: hidden;
  }

  .result-text {
    font-size: 1.5rem;
    font-weight: 900;
    color: var(--accent);
    line-height: 1.3;
    text-shadow: 0 0 10px rgba(163, 230, 53, 0.5);
    z-index: 2;
  }

  /* Стиль під час обертання */
  .result-box.spinning {
    border-color: var(--purple);
    box-shadow: 0 0 30px rgba(139, 92, 246, 0.5);
  }
  .result-box.spinning .result-text {
    color: var(--purple);
    opacity: 0.8;
    text-shadow: 0 0 10px rgba(139, 92, 246, 0.8);
  }

  /* Переможний стиль */
  .result-box.winner {
    border-color: var(--primary);
    background: #2a0a10;
    box-shadow: 0 0 50px rgba(255, 107, 0, 0.6);
    animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .result-box.winner .result-text {
    color: var(--primary);
    text-shadow: 0 0 20px rgba(255, 107, 0, 0.8);
  }

  @keyframes pop {
    0% { transform: scale(0.8); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  /* === КНОПКИ === */
  .btn {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 16px;
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: 900;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 60px;
  }

  .btn:active {
    transform: scale(0.96);
  }

  .btn-spin {
    background: linear-gradient(135deg, var(--purple), #6d28d9);
    color: #fff;
    box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
  }

  .btn-spin:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .btn-next {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    box-shadow: 0 6px 20px rgba(255, 107, 0, 0.4);
    display: none;
    margin-top: 12px;
  }

  /* Кажани на фоні */
  .bat {
    position: absolute;
    font-size: 1.5rem;
    opacity: 0;
    z-index: 1;
    animation: fly 8s linear infinite;
  }
  
  @keyframes fly {
    0% { transform: translate(-10vw, 20vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.8; }
    100% { transform: translate(110vw, 10vh) rotate(45deg); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .spider, .bg-web svg, .bat, .result-box.winner {
      animation: none !important;
    }
    .spider { top: 10%; left: 80%; }
  }
</style>
</head>
<body>

  <!-- Анімована павутина (SVG) -->
  <div class="bg-web" aria-hidden="true">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none">
      <g stroke="#a3e635" stroke-width="0.2" fill="none">
        <!-- Промені -->
        <line x1="50" y1="50" x2="0" y2="0" />
        <line x1="50" y1="50" x2="100" y2="0" />
        <line x1="50" y1="50" x2="0" y2="100" />
        <line x1="50" y1="50" x2="100" y2="100" />
        <line x1="50" y1="50" x2="50" y2="0" />
        <line x1="50" y1="50" x2="50" y2="100" />
        <line x1="50" y1="50" x2="0" y2="50" />
        <line x1="50" y1="50" x2="100" y2="50" />
        <!-- Кола -->
        <circle cx="50" cy="50" r="15" />
        <circle cx="50" cy="50" r="30" />
        <circle cx="50" cy="50" r="45" />
        <circle cx="50" cy="50" r="60" />
      </g>
    </svg>
  </div>

  <!-- Кажани -->
  <span class="bat" style="animation-delay: 0s;">🦇</span>
  <span class="bat" style="animation-delay: 3s; font-size: 1.2rem;">🦇</span>
  <span class="bat" style="animation-delay: 6s; font-size: 2rem;">🦇</span>

  <!-- Павучок, що повзе -->
  <div class="spider" aria-hidden="true">
    <svg viewBox="0 0 40 40">
      <g fill="#1a1a1a" stroke="#a3e635" stroke-width="1.5">
        <ellipse cx="20" cy="26" rx="9" ry="7"/>
        <circle cx="20" cy="16" r="5"/>
        <line x1="12" y1="22" x2="2" y2="16"/>
        <line x1="12" y1="26" x2="0" y2="26"/>
        <line x1="12" y1="30" x2="2" y2="36"/>
        <line x1="28" y1="22" x2="38" y2="16"/>
        <line x1="28" y1="26" x2="40" y2="26"/>
        <line x1="28" y1="30" x2="38" y2="36"/>
      </g>
      <circle cx="18" cy="15" r="1.5" fill="#ef4444"/>
      <circle cx="22" cy="15" r="1.5" fill="#ef4444"/>
    </svg>
  </div>

  <!-- Основна картка -->
  <div class="fate-card">
    <h1 class="title">🎃 Доля обирає</h1>
    <p class="subtitle">Натисни, щоб дізнатися свою групу</p>

    <div class="result-box" id="resultBox">
      <div class="result-text" id="resultText">???</div>
    </div>

    <button class="btn btn-spin" id="spinBtn" type="button">
      <span>Крутити долю</span>
      <span style="font-size:1.3rem">🎰</span>
    </button>

    <button class="btn btn-next" id="nextBtn" type="button">
      <span>Далі →</span>
    </button>
  </div>

<script>
  // Список груп з вашого фото
  const GROUPS = [
    "Кислотні гарбузи",
    "Містичні молекули",
    "Алхіміки темряви",
    "Реакція на страх",
    "Привиди колби",
    "Чаклунки Менделєєва",
    "Хімічний апокаліпсис",
    "Без реакції не залишимо!",
    "Валентні відьми",
    "Несумісні сполуки",
    "Каталізатори жаху",
    "Небезпечні елементи",
    "Формула переляку"
  ];

  let isSpinning = false;
  let spinInterval = null;
  let audioCtx = null;

  // === СИСТЕМНІ ЗВУКИ (Web Audio API) ===
  function initAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch(e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playTickSound() {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    } catch(e) {}
  }

  function playWinSound() {
    if (!audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, now + i * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.15, now + i * 0.1 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.1 + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + i * 0.1);
        osc.stop(now + i * 0.1 + 0.35);
      });
    } catch(e) {}
  }

  // === ЛОГІКА ГРИ ===
  const resultBox = document.getElementById('resultBox');
  const resultText = document.getElementById('resultText');
  const spinBtn = document.getElementById('spinBtn');
  const nextBtn = document.getElementById('nextBtn');

  function spinFate() {
    if (isSpinning) return;
    
    initAudio(); // Активуємо звук при першому кліку
    isSpinning = true;
    
    resultBox.classList.remove('winner');
    resultBox.classList.add('spinning');
    spinBtn.disabled = true;
    nextBtn.style.display = 'none';

    let spinCount = 0;
    const maxSpins = 25; // Кількість тіків

    spinInterval = setInterval(() => {
      const randomGroup = GROUPS[Math.floor(Math.random() * GROUPS.length)];
      resultText.textContent = randomGroup;
      playTickSound();
      
      spinCount++;
      if (spinCount >= maxSpins) {
        clearInterval(spinInterval);
        finishSpin();
      }
    }, 80); // Швидкість перебору
  }

  function finishSpin() {
    isSpinning = false;
    
    const winner = GROUPS[Math.floor(Math.random() * GROUPS.length)];
    
    resultBox.classList.remove('spinning');
    resultBox.classList.add('winner');
    resultText.textContent = winner;
    
    playWinSound();
    if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 150]); // Вібрація для Samsung
    
    spinBtn.disabled = false;
    nextBtn.style.display = 'flex';
  }

  // Обробники подій
  spinBtn.addEventListener('click', spinFate);
  
  nextBtn.addEventListener('click', () => {
    // Тут можна додати перехід на наступний екран
    alert('Вітаємо у групі: ' + resultText.textContent);
  });
</script>
</body>
</html>
