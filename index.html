<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Водяна Лінза | Еко-Детективи</title>
    <style>
        :root {
            --primary: #0ea5e9;
            --bg-dark: #0f172a;
            --text-light: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh; /* For modern mobile browsers */
        }
        /* Header UI */
        header {
            position: absolute;
            top: 0; left: 0; right: 0;
            padding: 15px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(10px);
            text-align: center;
            z-index: 10;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        header h1 { font-size: 1.2rem; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; color: var(--primary); }
        header p { font-size: 0.85rem; opacity: 0.8; }
        
        /* Main Canvas Setup */
        #simulator-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        video { display: none; } /* Hidden video element for feed */

        /* Controls UI */
        .controls {
            position: absolute;
            bottom: 30px;
            left: 0; right: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 10;
            padding: 0 20px;
        }
        button {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        button:hover { background: rgba(255, 255, 255, 0.2); }
        button.primary { background: var(--primary); border-color: var(--primary); }
        button.primary:hover { background: #0284c7; }

        /* Loader */
        #loader {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            z-index: 20;
        }
    </style>
</head>
<body>

    <header>
        <h1>Слідчий апарат: Водяна Лінза</h1>
        <p>Наведіть камеру на стрілку так, щоб вона опинилася всередині склянки</p>
    </header>

    <div id="simulator-container">
        <div id="loader">Запуск камери...</div>
        <canvas id="lensCanvas"></canvas>
        <video id="videoElement" autoplay playsinline></video>
    </div>

    <div class="controls">
        <button id="switchBtn">🔄 Змінити камеру</button>
        <button id="captureBtn" class="primary">📸 Доказ</button>
    </div>

    <script>
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('lensCanvas');
        const ctx = canvas.getContext('2d');
        const switchBtn = document.getElementById('switchBtn');
        const captureBtn = document.getElementById('captureBtn');
        const loader = document.getElementById('loader');

        let currentStream = null;
        let useFrontCamera = false;

        // Initialize Camera
        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    facingMode: useFrontCamera ? "user" : "environment",
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                video.onloadedmetadata = () => {
                    video.play();
                    loader.style.display = 'none';
                    requestAnimationFrame(drawSimulator);
                };
            } catch (err) {
                console.error("Помилка доступу до камери:", err);
                loader.innerHTML = "⚠️ Надайте дозвіл на використання камери";
            }
        }

        // Main Render Loop
        function drawSimulator() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // Set canvas size to match screen
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                // 1. Calculate aspect ratio to "cover" the screen (like object-fit: cover)
                const scale = Math.max(canvas.width / video.videoWidth, canvas.height / video.videoHeight);
                const vidWidth = video.videoWidth * scale;
                const vidHeight = video.videoHeight * scale;
                const vidX = (canvas.width - vidWidth) / 2;
                const vidY = (canvas.height - vidHeight) / 2;

                // 2. Draw normal background (blurry/darkened slightly to emphasize the glass)
                ctx.globalAlpha = 0.6;
                // If using front camera, mirror the background for natural feel
                if (useFrontCamera) {
                    ctx.save();
                    ctx.translate(canvas.width, 0);
                    ctx.scale(-1, 1);
                    ctx.drawImage(video, canvas.width - vidX - vidWidth, vidY, vidWidth, vidHeight);
                    ctx.restore();
                } else {
                    ctx.drawImage(video, vidX, vidY, vidWidth, vidHeight);
                }
                ctx.globalAlpha = 1.0;

                // 3. Define the "Glass of Water" dimensions
                const glassWidth = Math.min(canvas.width * 0.45, 300);
                const glassHeight = Math.min(canvas.height * 0.6, 500);
                const glassX = (canvas.width - glassWidth) / 2;
                const glassY = (canvas.height - glassHeight) / 2;
                const cornerRadius = 15;

                // 4. Create Clipping Path for the Glass
                ctx.save();
                ctx.beginPath();
                ctx.roundRect(glassX, glassY, glassWidth, glassHeight, cornerRadius);
                ctx.clip();

                // 5. Draw the FLIPPED video inside the glass (The Physics Magic)
                // Water acts as a convex lens, flipping the image horizontally
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
                
                // Calculate correct X position for flipped coordinate system
                const flippedVidX = canvas.width - vidX - vidWidth;
                
                // If front camera is used, double flip makes it normal, so we just draw normal inside the glass
                // To keep the "experiment" working, front camera background is mirrored, glass is unmirrored.
                if(useFrontCamera) {
                    ctx.scale(-1, 1);
                    ctx.translate(-canvas.width, 0);
                    ctx.drawImage(video, vidX, vidY, vidWidth, vidHeight);
                } else {
                    ctx.drawImage(video, flippedVidX, vidY, vidWidth, vidHeight);
                }
                
                // Add water tint
                ctx.fillStyle = 'rgba(14, 165, 233, 0.15)'; // Cyan tint
                ctx.fill();
                ctx.restore();

                // 6. Draw Glass UI (Borders and glare)
                ctx.beginPath();
                ctx.roundRect(glassX, glassY, glassWidth, glassHeight, cornerRadius);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Left Glare
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.fillRect(glassX + 10, glassY + 20, 4, glassHeight - 40);
                // Right Glare
                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.fillRect(glassX + glassWidth - 15, glassY + 20, 2, glassHeight - 40);
            }
            requestAnimationFrame(drawSimulator);
        }

        // Event Listeners
        switchBtn.addEventListener('click', () => {
            useFrontCamera = !useFrontCamera;
            startCamera();
        });

        captureBtn.addEventListener('click', () => {
            // Flash effect
            const flash = document.createElement('div');
            flash.style.position = 'absolute';
            flash.style.top = '0'; flash.style.left = '0';
            flash.style.width = '100%'; flash.style.height = '100%';
            flash.style.background = 'white';
            flash.style.zIndex = '100';
            flash.style.transition = 'opacity 0.5s';
            document.body.appendChild(flash);
            
            setTimeout(() => { flash.style.opacity = '0'; }, 100);
            setTimeout(() => { document.body.removeChild(flash); }, 600);

            // Download Image
            const link = document.createElement('a');
            link.download = 'Доказ_Водяна_Лінза.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        // Start
        window.addEventListener('load', startCamera);
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
